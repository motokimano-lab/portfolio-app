name: Refresh Mutual Fund Cache

on:
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * 1-5'  # 00:30 JST on Tue-Sat, after Japan business days

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh official mutual fund cache
        run: python update_mutual_fund_cache.py

      - name: Commit cache if changed
        run: |
          if git diff --quiet -- data/mutual_fund_cache.json; then
            echo "No cache change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mutual_fund_cache.json
          git commit -m "Refresh mutual fund cache"
          git push
